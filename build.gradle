dependencies {
  // lombok
  compileOnly "org.projectlombok:lombok:${project.lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
  implementation "net.neoforged:neoforge:${neo_version}"
  compileOnly runtimeOnly("es.degrassi:experiencelib:${minecraft_version}-${experiencelib_version}")

  //LDLib2
  compileOnly ("org.appliedenergistics.yoga:yoga:${yoga_version}")
  implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }

  // ProbeJS
  runtimeOnly("curse.maven:probejs-585406:7105159")

  // JEI
  compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
  compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

  // EMI
  compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")
  compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")

  // KubeJS
  compileOnly runtimeOnly("dev.latvian.mods:kubejs-neoforge:$kubejs_version")

  // Jade
  compileOnly runtimeOnly("curse.maven:jade-324717:${jade_version}")

  // The one probe
  compileOnly runtimeOnly("mcjty.theoneprobe:theoneprobe:${top_version}") {transitive = false}

  // Mekanism
  compileOnly runtimeOnly("mekanism:Mekanism:${mekanism_version}")

  // Almost unified
  compileOnly runtimeOnly("com.almostreliable.mods:almostunified-neoforge:${almostunified_version}")

  // Athena
  compileOnly runtimeOnly("earth.terrarium.athena:athena-neoforge-1.21.1:${athena_version}")

  // setup Xei
  switch (use_Xei) {
    case "emi":
      runtimeOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
      break
    case "jei":
      runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
      break
  }

  // Addons for testing
//  localRuntime("es.degrassi:modular_machinery_reborn_energistics:${minecraft_version}-3.0.0")
  runtimeOnly("es.degrassi:modular_machinery_reborn_ars:${minecraft_version}-3.0.3") { transitive = false }
  runtimeOnly("es.degrassi:modular_machinery_reborn_mekanism:${minecraft_version}-3.0.3") { transitive = false }
  compileOnly runtimeOnly("org.appliedenergistics:appliedenergistics2:19.2.10")
  compileOnly runtimeOnly("es.degrassi:applied-experienced:${minecraft_version}-1.3.2")
  runtimeOnly("curse.maven:applied-mekanistics-574300:5978711")
  runtimeOnly("curse.maven:ars-energistique-905641:5978726")
  runtimeOnly("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.7.5.1")
  runtimeOnly("vazkii.patchouli:Patchouli:1.21-88-NEOFORGE-SNAPSHOT")
  runtimeOnly("top.theillusivec4.curios:curios-neoforge:9.4.2+1.21.1")
  runtimeOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${project.minecraft_version}:5.11.2.1298")

  // ProjectE due to a report
  // runtimeOnly("curse.maven:projecte-226410:6611984")

  // experience fluids
  runtimeOnly("curse.maven:mob-grinding-utils-254241:${project.MGU}")
  runtimeOnly("curse.maven:titanium-287342:${titanium}")
  runtimeOnly("curse.maven:industrial-foregoing-266515:${project.IF}")

  // Observable profiling
  runtimeOnly "curse.maven:architectury-api-419699:5786327"
  runtimeOnly "curse.maven:kotlin-for-forge-351264:5978393"
  runtimeOnly("curse.maven:observable-509575:5733591")
  // Spark profiling
  runtimeOnly("curse.maven:spark-361579:6225208")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
      minecraft_version      : minecraft_version,
      minecraft_version_range: minecraft_version_range,
      neo_version            : neo_version,
      neo_version_range      : neo_version_range,
      loader_version_range   : loader_version_range,
      mod_id                 : mod_id,
      mod_name               : mod_name,
      mod_license            : mod_license,
      mod_version            : mod_version,
      mod_authors            : mod_authors,
      mod_description        : mod_description,
      mod_url                : mod_url,
      icon                   : icon,
      experiencelib_version  : experiencelib_version,
      pack_format_number     : pack_format_number,
      top_version            : top_version,
      emi_version            : emi_version,
      kubejs_version         : kubejs_version,
      jei_version            : jei_version,
      almostunified_version  : almostunified_version,
      athena_version         : athena_version,
      ldlib2_version         : ldlib2_version
  ]
  inputs.properties replaceProperties
  expand replaceProperties
  from "src/main/templates"
  into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
  publications {
    register('mavenJava', MavenPublication) {
      groupId = maven_group
      artifactId = archivesBaseName
      version = project.version
      from components.java

      pom {
        name = mod_name
        description = mod_description
        packaging = 'jar'
        scm {
          url = mod_github
        }
        issueManagement {
          system = 'github'
          url = mod_issues
        }
        licenses {
          license {
            name = mod_license
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = mod_authors
            name = mod_authors
            roles = ['developper']
          }
        }
      }
    }
  }
  repositories {
    maven {
      name = 'maven'
      url = 'https://maven.degrassi.es/releases'
      credentials {
        username = "Alec_016GG"
        password = System.getenv("MAVEN_PASSWORD")
      }
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

unifiedPublishingWithMMRBot {
  project {
    displayName = "[NeoForge]ModularMachineyReborn-${minecraft_version}-${mod_version}"
    releaseType = "release"
    if (rootProject.file("CHANGELOG.md").exists()) {
      changelog = rootProject.file("CHANGELOG.md").text
    }
    gameVersions = ["${minecraft_version}", "1.21"]
    gameLoaders = ["neoforge"]
    mainPublication jar
    modid = mod_id
    modVersion = "ModularMachineyReborn-${minecraft_version}-${mod_version}"

    var CURSE_API_KEY = System.getenv("CURSEFORGE")
    if (CURSE_API_KEY != null) {
      curseforge {
        token = CURSE_API_KEY
        id = "1083840"
        relations {
          depends "experiencelib"
          depends "athena"
          optional "kubejs"
          optional "jei"
          optional "emi"
          optional "jade"
          optional "the-one-probe"
          optional "almostunified"
          optional "ldlib"
        }
      }
    }

    var MODRINTH_API_KEY = System.getenv("MODRINTH")
    if (MODRINTH_API_KEY != null) {
      modrinth {
        token = MODRINTH_API_KEY
        id = "oPdlqv8D"
        relations {
          depends "experiencelib"
          depends "athena"
          optional "kubejs"
          optional "jei"
          optional "emi"
          optional "jade"
          optional "the-one-probe"
          optional "almost-unified"
          optional "ldlib"
        }
      }
    }
  }
}
