dependencies {
  // lombok
  compileOnly "org.projectlombok:lombok:${project.lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
  implementation "net.neoforged:neoforge:${neo_version}"
  compileOnly runtimeOnly("es.degrassi:experiencelib:${mc_base_version}-${experiencelib_version}")

  //ldlib2
  implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}") { transitive = false }

  // Athena
  compileOnly runtimeOnly("earth.terrarium.athena:athena-neoforge-26.1:${athena_version}")

  // JEI
  compileOnly("mezz.jei:jei-${mc_base_version}-neoforge-api:${jei_version}")
  compileOnly localRuntime("mezz.jei:jei-${mc_base_version}-neoforge:${jei_version}")

  switch(use_xei) {
    case 'emi':
      // TODO: enable when EMI is ported to 26.1
      /*// EMI
      compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")
      compileOnly localRuntime("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")*/
      break
  }

  // KubeJS
  compileOnly runtimeOnly("dev.latvian.mods:kubejs-neoforge:$kubejs_version")

  // Jade
  compileOnly runtimeOnly("curse.maven:jade-324717:${jade_version}")

  // The one probe
  compileOnly runtimeOnly("mcjty.theoneprobe:theoneprobe:${top_version}") {transitive = false}
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
      minecraft_version      : minecraft_version,
      minecraft_version_range: minecraft_version_range,
      neo_version            : neo_version,
      neo_version_range      : neo_version_range,
      loader_version_range   : loader_version_range,
      mod_id                 : mod_id,
      mod_name               : mod_name,
      mod_license            : mod_license,
      mod_version            : mod_version,
      mod_authors            : mod_authors,
      mod_description        : mod_description,
      mod_url                : mod_url,
      icon                   : icon,
      experiencelib_version  : experiencelib_version,
      // pack_format_number     : pack_format_number,
      top_version            : top_version,
      // emi_version            : emi_version,
      kubejs_version         : kubejs_version,
      jei_version            : jei_version,
      // almostunified_version  : almostunified_version,
      athena_version         : athena_version,
      ldlib2_version         : ldlib2_version
  ]
  inputs.properties replaceProperties
  expand replaceProperties
  from "src/main/templates"
  into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata


// Example configuration to allow publishing using the maven-publish plugin
publishing {
  publications {
    register('mavenJava', MavenPublication) {
      groupId = maven_group
      artifactId = mod_id
      version = project.version
      from components.java

      pom {
        name = mod_name
        description = mod_description
        packaging = 'jar'
        scm {
          url = mod_github
        }
        issueManagement {
          system = 'github'
          url = mod_issues
        }
        licenses {
          license {
            name = mod_license
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = mod_authors
            name = mod_authors
            roles = ['developper']
          }
        }
      }
    }
  }
  repositories {
    maven {
      name = 'maven'
      url = 'https://maven.degrassi.es/releases'
      credentials {
        username = "Alec_016GG"
        password = System.getenv("MAVEN_PASSWORD")
      }
    }
  }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

unifiedPublishingWithMMRBot {
  project {
    displayName = "[NeoForge]ModularMachineyReborn-${mc_base_version}-${mod_version}"
    releaseType = "release"
    if (rootProject.file("CHANGELOG.md").exists()) {
      changelog = rootProject.file("CHANGELOG.md").text
    }
    gameVersions = ["${mc_base_version}"]
    gameLoaders = ["neoforge"]
    mainPublication jar
    modid = mod_id
    modVersion = "ModularMachineyReborn-${mc_base_version}-${mod_version}"
    apiKey = System.getenv("MMRBOT")
    environments = ['Client', 'Server']

    var CURSE_API_KEY = System.getenv("CURSEFORGE")
    if (CURSE_API_KEY != null) {
      curseforge {
        // gameVersionNames = ["Client", "Server"] this will be required in newer updates in curseforge
        token = CURSE_API_KEY
        id = "1083840"
        relations {
          depends "experiencelib"
          depends "athena"
          depends "ldlib"
          optional "kubejs"
          optional "jei"
          // optional "emi"
          optional "jade"
          optional "the-one-probe"
          // optional "almostunified"
        }
      }
    }

    var MODRINTH_API_KEY = System.getenv("MODRINTH")
    if (MODRINTH_API_KEY != null) {
      modrinth {
        token = MODRINTH_API_KEY
        id = "oPdlqv8D"
        relations {
          depends "experiencelib"
          depends "athena"
          depends "ldlib"
          optional "kubejs"
          optional "jei"
          // optional "emi"
          optional "jade"
          optional "the-one-probe"
          optional "almostunified"
        }
      }
    }
  }
}
