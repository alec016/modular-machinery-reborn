plugins {
  id 'java-library'
  id 'idea'
  id 'maven-publish'
  id 'net.neoforged.moddev' version '2.0.105'
  id "es.degrassi.unified-publishing-with-mmr-bot" version "1.3.1"
  id "io.freefair.lombok" version "9.2.0"
}

tasks.named('wrapper', Wrapper).configure {
  distributionType = Wrapper.DistributionType.BIN
}

base {
  archivesName = archives_base_name
  version = "${minecraft_version}-${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

tasks.processResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

neoForge {
  version = project.neo_version

  parchment {
    mappingsVersion = project.parchment_mappings_version
    minecraftVersion = project.parchment_minecraft_version
  }

  accessTransformers.from project.files('src/main/resources/META-INF/accesstransformer.cfg')

  runs {
    client {
      client()
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    server {
      server()
      programArgument "--nogui"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    gameTestServer {
      type = "gameTestServer"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    data {
      data()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }
  }

  mods {
    "${mod_id}" {
      sourceSet(sourceSets.main)
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
  libraries
  // This will make sure that all dependencies that you add to the libraries configuration will also be added to the implementation configuration
  // This way, you only need one dependency declaration for both runtime and compile dependencies
  implementation.extendsFrom libraries
}

repositories {
