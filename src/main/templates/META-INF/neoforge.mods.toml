modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"

[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
displayURL="${mod_url}"
logoFile="${icon}"
#credits=""
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="experiencelib"
type="required"
versionRange="[${experiencelib_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="athena"
type="required"
versionRange="[${athena_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[${jei_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[${emi_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="[${kubejs_version},)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="theoneprobe"
type="optional"
versionRange="[${top_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="almostunified"
type="optional"
versionRange="[${almostunified_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="optional"
versionRange="[${ldlib2_version},)"
ordering="AFTER"
side="BOTH"